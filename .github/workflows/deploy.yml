name: Deploy to EC2 via SSM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload site files to S3 staging prefix
        run: |
          aws s3 cp index.html s3://freshfoods-jbeaty-assets/deploy/index.html
          aws s3 cp index.php s3://freshfoods-jbeaty-assets/deploy/index.php
          aws s3 cp order.php s3://freshfoods-jbeaty-assets/deploy/order.php
          aws s3 cp health.php s3://freshfoods-jbeaty-assets/deploy/health.php
          aws s3 cp db-connect.php s3://freshfoods-jbeaty-assets/deploy/db-connect.php

      - name: Deploy via SSM Run Command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions ($GITHUB_SHA)" \
            --parameters 'commands=[
              "aws s3 cp s3://freshfoods-jbeaty-assets/deploy/index.html /usr/share/nginx/html/index.html",
              "aws s3 cp s3://freshfoods-jbeaty-assets/deploy/index.php /usr/share/nginx/html/index.php",
              "aws s3 cp s3://freshfoods-jbeaty-assets/deploy/order.php /usr/share/nginx/html/order.php",
              "aws s3 cp s3://freshfoods-jbeaty-assets/deploy/health.php /usr/share/nginx/html/health.php",
              "aws s3 cp s3://freshfoods-jbeaty-assets/deploy/db-connect.php /usr/share/nginx/html/db-connect.php",
              "systemctl reload nginx"
            ]' \
            --query "Command.CommandId" \
            --output text)
          echo "Sent command $COMMAND_ID, waiting for it to finish..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)
          echo "Deployment status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "----- Command output -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"
            exit 1
          fi

      - name: Verify deployment health
        env:
          HEALTH_URL: https://freshfoods-jbeaty.duckdns.org/health.php
        run: |
          echo "Polling $HEALTH_URL until the deployed app reports healthy..."
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -fsS --max-time 10 "$HEALTH_URL" || echo "no response")
            echo "Attempt $i: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"status":"ok"' \
               && echo "$RESPONSE" | grep -q '"database":"connected"'; then
              echo "Health check passed. Deployment is serving traffic."
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 5 attempts; the deployed site is not healthy."
          exit 1
